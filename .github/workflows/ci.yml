name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: apsferreira/pulse-service

jobs:
  # ── Testes — não bloqueiam o deploy ─────────────────────────────────────────
  # continue-on-error: true garante que falha nos testes não impede build/deploy.
  # Resultado visível no PR como check separado, mas o pipeline avança.
  test:
    name: Test
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24"

      - name: Download dependencies
        env:
          GOTOOLCHAIN: auto
        run: go mod tidy && go mod download

      - name: Apply migrations
        env:
          PGPASSWORD: postgres
        run: |
          for f in $(ls migrations/*.sql | sort); do
            echo "Applying $f..."
            psql -h localhost -U postgres -d pulse_test -f "$f"
          done

      - name: Run tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/pulse_test?sslmode=disable
          REDIS_URL: redis://localhost:6379
          SERVICE_TOKEN: test-token
          GOTOOLCHAIN: auto
        run: |
          PKGS=$(grep -rl "_test.go" --include="*.go" . | grep -v "^./sdk" | xargs -I{} dirname {} | sort -u | tr '\n' ' ')
          go test $PKGS -coverprofile=coverage.out -covermode=set

      - name: Coverage report
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
          echo "Cobertura total: ${COVERAGE}%"
        continue-on-error: true

  # ── Build backend — roda sempre no main, independente dos testes ─────────────
  build-and-push:
    name: Build & Push Backend
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main-latest
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Build frontend — roda sempre no main, independente dos testes ────────────
  build-and-push-frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta-frontend
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/apsferreira/pulse-service-frontend
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          build-args: |
            VITE_SERVICE_TOKEN=${{ secrets.PULSE_SERVICE_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Atualiza manifests K8s — só roda após ambos os builds passarem ───────────
  update-manifest:
    name: Update K8s Manifest
    runs-on: ubuntu-latest
    needs: [build-and-push, build-and-push-frontend]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Update image tags in deployments
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          sed -i "s|image: ghcr.io/apsferreira/pulse-service:.*|image: ghcr.io/apsferreira/pulse-service:sha-${SHORT_SHA}|" deploy/k8s/deployment.yaml
          sed -i "s|image: ghcr.io/apsferreira/pulse-service-frontend:.*|image: ghcr.io/apsferreira/pulse-service-frontend:sha-${SHORT_SHA}|" deploy/k8s/frontend-deployment.yaml

      - name: Commit updated manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/k8s/deployment.yaml deploy/k8s/frontend-deployment.yaml
          git diff --staged --quiet || git commit -m "ci: update pulse-service images to sha-$(echo '${{ github.sha }}' | cut -c1-7)"
          git push
