name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: apsferreira/pulse-service

jobs:
  # ── Testes — gate de qualidade ──────────────────────────────────────────────
  test:
    name: Test
    runs-on: iit-pulse
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: LGPD gate — sem PII em logs
        run: bash scripts/check-pii-logs.sh

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Start Postgres + Redis via Docker
        run: |
          docker run -d --name pg_test \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=*** \
            -e POSTGRES_DB=pulse_test \
            -p 5432:5432 \
            postgres:15
          docker run -d --name redis_test \
            -p 6379:6379 \
            redis:7-alpine
          # Aguarda Postgres ficar pronto (sem psql no host — usa docker exec)
          for i in $(seq 1 30); do
            docker exec pg_test pg_isready -U postgres 2>/dev/null && echo "postgres pronto" && break
            sleep 2
          done

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - name: Download dependencies
        env:
          GOTOOLCHAIN: auto
        run: go mod download

      - name: Apply migrations
        run: |
          # Aplica via docker exec — sem precisar de psql no host
          for f in $(ls migrations/*.sql | sort); do
            echo "Applying $f..."
            docker exec -i pg_test psql -U postgres -d pulse_test < "$f"
          done

      - name: Run tests
        env:
          DATABASE_URL: postgres://postgres:***@localhost:5432/pulse_test?sslmode=disable
          REDIS_URL: redis://localhost:***@v4
          SERVICE_TOKEN: test-token
          GOTOOLCHAIN: auto
        run: |
          PKGS=$(grep -rl "_test.go" --include="*.go" . | grep -v "^./sdk" | xargs -I{} dirname {} | sort -u | tr '\n' ' ')
          go test $PKGS -coverprofile=coverage.out -covermode=set

      - name: Coverage gate (>= 40%)
        run: |
          go tool cover -func=coverage.out \
            | awk '/total/{gsub(/%/,"",$3); if($3+0 < 40){printf "FAIL: coverage %.1f%% < 40%%\n",$3; exit 1}else{printf "PASS: coverage %.1f%%\n",$3}}'

      - name: Cleanup containers
        if: always()
        run: docker rm -f pg_test redis_test 2>/dev/null || true

  # ── Lint — gosec + TruffleHog ───────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: iit-pulse
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - name: Download dependencies
        env:
          GOTOOLCHAIN: auto
        run: go mod download

      - name: Run gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -exclude-generated -severity medium -confidence medium ./...

      - name: Run golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          golangci-lint run ./...

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Run TruffleHog
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace aquasec/trufflehog:latest filesystem --no-verification /workspace

  # ── Build backend ───────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Backend
    runs-on: iit-pulse
    needs: [test, lint]
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main-latest
            type=sha,prefix=sha-

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Buildx driver docker
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          no-cache: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ── Build frontend ───────────────────────────────────────────────────────────
  build-and-push-frontend:
    name: Build & Push Frontend
    runs-on: iit-pulse
    needs: [test, lint]
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta-frontend
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/apsferreira/pulse-service-frontend
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Setup Buildx driver docker
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=local,src=/home/runner/buildcache-frontend
          cache-to: type=local,dest=/home/runner/buildcache-frontend,mode=max
          build-args: |
            VITE_AUTH_SERVICE_URL=https://auth.institutoitinerante.com.br
            VITE_SERVICE_TOKEN=${{ secrets.PULSE_SERVICE_TOKEN }}
            BUILDKIT_INLINE_CACHE=1

  # ── Atualiza manifests K8s ───────────────────────────────────────────────────
  update-manifest:
    name: Update K8s Manifest
    runs-on: iit-pulse
    needs: [build-and-push, build-and-push-frontend]
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update image tags
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          sed -i "s|image: ghcr.io/apsferreira/pulse-service:.*|image: ghcr.io/apsferreira/pulse-service:sha-${SHORT_SHA}|" deploy/k8s/deployment.yaml
          sed -i "s|image: ghcr.io/apsferreira/pulse-service-frontend:.*|image: ghcr.io/apsferreira/pulse-service-frontend:sha-${SHORT_SHA}|" deploy/k8s/frontend-deployment.yaml

      - name: Commit updated manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/k8s/deployment.yaml deploy/k8s/frontend-deployment.yaml
          git diff --staged --quiet || git commit -m "ci: update images to sha-$(echo '${{ github.sha }}' | cut -c1-7)"
          git push
