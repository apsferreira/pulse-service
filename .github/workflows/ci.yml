name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: apsferreira/pulse-service

jobs:
  # ── Testes — não bloqueiam o deploy ─────────────────────────────────────────
  test:
    name: Test
    runs-on: iit-pulse
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start Postgres + Redis via Docker
        run: |
          docker run -d --name pg_test \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=pulse_test \
            -p 5432:5432 \
            postgres:15
          docker run -d --name redis_test \
            -p 6379:6379 \
            redis:7-alpine
          # Aguarda Postgres ficar pronto (sem psql no host — usa docker exec)
          for i in $(seq 1 30); do
            docker exec pg_test pg_isready -U postgres 2>/dev/null && echo "postgres pronto" && break
            sleep 2
          done

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - name: Download dependencies
        env:
          GOTOOLCHAIN: auto
        run: go mod download

      - name: Apply migrations
        run: |
          # Aplica via docker exec — sem precisar de psql no host
          for f in $(ls migrations/*.sql | sort); do
            echo "Applying $f..."
            docker exec -i pg_test psql -U postgres -d pulse_test < "$f"
          done

      - name: Run tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/pulse_test?sslmode=disable
          REDIS_URL: redis://localhost:6379
          SERVICE_TOKEN: test-token
          GOTOOLCHAIN: auto
        run: |
          PKGS=$(grep -rl "_test.go" --include="*.go" . | grep -v "^./sdk" | xargs -I{} dirname {} | sort -u | tr '\n' ' ')
          go test $PKGS -coverprofile=coverage.out -covermode=set

      - name: Coverage report
        run: go tool cover -func=coverage.out | grep total || true
        continue-on-error: true

      - name: Cleanup containers
        if: always()
        run: docker rm -f pg_test redis_test 2>/dev/null || true

  # ── Build backend ────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Backend
    runs-on: iit-pulse
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main-latest
            type=sha,prefix=sha-

      - name: Pre-pull base images via mirror local
        run: |
          # Mirror pull-through em 192.168.30.110:30500 — rede local, sem TLS timeout
          for img in golang:1.24-alpine alpine:3.21; do
            docker pull 192.168.30.110:30500/$img 2>/dev/null \
              && docker tag 192.168.30.110:30500/$img $img \
              || docker pull $img
          done

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ env.IMAGE_NAME }}:main-latest
          cache-to: type=inline
          build-args: |
            BUILDKIT_INLINE_CACHE=1

  # ── Build frontend ───────────────────────────────────────────────────────────
  build-and-push-frontend:
    name: Build & Push Frontend
    runs-on: iit-pulse
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/apsferreira/pulse-service-frontend
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Pre-pull base images via mirror local
        run: |
          for img in node:22-alpine nginx:alpine; do
            docker pull 192.168.30.110:30500/$img 2>/dev/null \
              && docker tag 192.168.30.110:30500/$img $img \
              || docker pull $img
          done

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/apsferreira/pulse-service-frontend:latest
          cache-to: type=inline
          build-args: |
            VITE_SERVICE_TOKEN=${{ secrets.PULSE_SERVICE_TOKEN }}
            BUILDKIT_INLINE_CACHE=1

  # ── Atualiza manifests K8s ───────────────────────────────────────────────────
  update-manifest:
    name: Update K8s Manifest
    runs-on: iit-pulse
    needs: [build-and-push, build-and-push-frontend]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update image tags
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          sed -i "s|image: ghcr.io/apsferreira/pulse-service:.*|image: ghcr.io/apsferreira/pulse-service:sha-${SHORT_SHA}|" deploy/k8s/deployment.yaml
          sed -i "s|image: ghcr.io/apsferreira/pulse-service-frontend:.*|image: ghcr.io/apsferreira/pulse-service-frontend:sha-${SHORT_SHA}|" deploy/k8s/frontend-deployment.yaml

      - name: Commit updated manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/k8s/deployment.yaml deploy/k8s/frontend-deployment.yaml
          git diff --staged --quiet || git commit -m "ci: update images to sha-$(echo '${{ github.sha }}' | cut -c1-7)"
          git push
