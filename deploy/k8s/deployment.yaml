apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulse-service
  namespace: production
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app: pulse-service
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: pulse-service
  template:
    metadata:
      labels:
        app: pulse-service
    spec:
      containers:
        - name: pulse-service
          image: ghcr.io/apsferreira/pulse-service:sha-ad452f1
          imagePullPolicy: Always
          ports:
            - containerPort: 3050
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: pulse-service-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: pulse-service-secrets
                  key: redis-url
            - name: SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: pulse-service-secrets
                  key: service-token
            - name: PULSE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: pulse-service-secrets
                  key: jwt-secret
            - name: PORT
              value: "3050"
            - name: LOG_LEVEL
              value: "info"
            - name: APP_ENV
              value: "production"
            - name: AUTH_SERVICE_URL
              value: "https://auth.institutoitinerante.com.br"
            - name: PULSE_DASHBOARD_ORIGINS
              value: "https://pulse.institutoitinerante.com.br"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3050
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 3050
            initialDelaySeconds: 5
            periodSeconds: 10
