apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: pulse-service
  namespace: production
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-cluster-store
  target:
    name: pulse-service-secrets
    creationPolicy: Merge
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: secret/pulse-service
