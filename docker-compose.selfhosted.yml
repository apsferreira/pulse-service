version: "3.9"

# Pulse — Self-Hosted
# Uso: docker compose -f docker-compose.selfhosted.yml up -d
# Docs: docs/self-hosted.md
#
# Variáveis obrigatórias:
#   SERVICE_TOKEN        — token admin interno (gere com: openssl rand -hex 32)
#
# Modo de autenticação (escolha um):
#
#   Opção A — Auth local (sem auth-service externo, recomendado para self-hosted):
#     PULSE_AUTH_MODE=local
#     PULSE_JWT_SECRET=<openssl rand -hex 32>  (opcional — usa SERVICE_TOKEN como fallback)
#     VITE_AUTH_MODE=local
#     Após subir: POST http://localhost:3015/api/v1/auth/setup para criar o primeiro usuário.
#
#   Opção B — Auth externo (OAuth via auth-service):
#     PULSE_AUTH_MODE=external   (default)
#     PULSE_AUTH_URL=https://auth.suaempresa.com
#
# Variáveis opcionais:
#   POSTGRES_PASSWORD    — senha do PostgreSQL (default: pulse_secret — troque em prod)
#   PULSE_API_URL        — URL pública da API (default: http://localhost:3015)
#   PULSE_BILLING_URL    — URL do portal de upgrade exibida no HTTP 429 (default: vazio)
#   RESEND_API_KEY       — chave Resend para envio de emails (opcional)
#   RESEND_FROM          — endereço de remetente dos emails (opcional)
#   LOG_LEVEL            — nível de log: debug|info|warn|error (default: info)

services:
  pulse-backend:
    image: ${PULSE_IMAGE:-ghcr.io/institutoitinerante/pulse-service:latest}
    container_name: pulse-backend
    restart: unless-stopped
    ports:
      - "3015:3015"
    environment:
      DATABASE_URL: postgres://pulse:${POSTGRES_PASSWORD:-pulse_secret}@pulse-postgres:5432/pulse_db?sslmode=disable
      REDIS_URL: redis://pulse-redis:6379
      PORT: "3015"
      SERVICE_TOKEN: ${SERVICE_TOKEN:?SERVICE_TOKEN is required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SELF_HOSTED: "true"
      PULSE_BILLING_URL: ${PULSE_BILLING_URL:-}
      PULSE_AUTH_MODE: ${PULSE_AUTH_MODE:-external}
      PULSE_JWT_SECRET: ${PULSE_JWT_SECRET:-}
    depends_on:
      pulse-postgres:
        condition: service_healthy
      pulse-redis:
        condition: service_healthy
    networks:
      - pulse-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3015/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  pulse-frontend:
    image: ${PULSE_FRONTEND_IMAGE:-ghcr.io/institutoitinerante/pulse-frontend:latest}
    container_name: pulse-frontend
    restart: unless-stopped
    ports:
      - "3016:80"
    environment:
      VITE_API_URL: ${PULSE_API_URL:-http://localhost:3015}
      VITE_AUTH_MODE: ${PULSE_AUTH_MODE:-external}
      VITE_AUTH_SERVICE_URL: ${PULSE_AUTH_URL:-}
    depends_on:
      - pulse-backend
    networks:
      - pulse-net

  pulse-postgres:
    image: postgres:15-alpine
    container_name: pulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pulse_db
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulse_secret}
    volumes:
      - pulse-postgres-data:/var/lib/postgresql/data
    networks:
      - pulse-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d pulse_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Não expor porta externamente em produção.
    # Para acesso local de debug: descomente a linha abaixo.
    # ports:
    #   - "5432:5432"

  pulse-redis:
    image: redis:7-alpine
    container_name: pulse-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - pulse-redis-data:/data
    networks:
      - pulse-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    # Não expor porta externamente em produção.
    # ports:
    #   - "6379:6379"

volumes:
  pulse-postgres-data:
    driver: local
  pulse-redis-data:
    driver: local

networks:
  pulse-net:
    driver: bridge
