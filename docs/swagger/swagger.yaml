      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_institutoitinerante_pulse-service_internal_domain.FlagApproval'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_institutoitinerante_pulse-service_internal_domain.ErrorResponse'
        "401":
          description: Unauthorized
