info:
  contact: {}
paths:
  /ai-configs:
    get:
      description: Retorna configs de IA (prompt, modelo, temperatura) — feature flags
        para LLMs
      parameters:
      - description: UUID do projeto
        in: query
        name: project_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_handler.AIConfig'
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - ServiceToken: []
      summary: Lista AI Configs do projeto
      tags:
      - ai-configs
    post:
      consumes:
      - application/json
      description: Cria nova configuração de IA com prompt, modelo, temperatura e
        max_tokens
      parameters:
      - description: Dados da AI Config
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.AIConfigRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - ServiceToken: []
      summary: Cria AI Config
      tags:
      - ai-configs
  /ai-configs/{key}:
    delete:
      description: Marca a config como inativa — rollback instantâneo sem redeploy
      parameters:
      - description: Chave da AI Config
        in: path
        name: key
        required: true
        type: string
      - description: UUID do projeto
        in: query
        name: project_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - ServiceToken: []
      summary: Desativa AI Config
      tags:
      - ai-configs
    get:
      description: Retorna a config ativa para uma key — usado pelo SDK em runtime
      parameters:
      - description: Chave da AI Config
        in: path
        name: key
        required: true
        type: string
      - description: UUID do projeto
        in: query
        name: project_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.AIConfig'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - ServiceToken: []
      summary: Obtém AI Config por chave
      tags:
      - ai-configs
    put:
      consumes:
      - application/json
      description: Atualiza prompt/modelo e salva versão anterior no histórico para
        rollback
      parameters:
      - description: Chave da AI Config
        in: path
        name: key
        required: true
        type: string
      - description: UUID do projeto
        in: query
        name: project_id
        required: true
        type: string
      - description: Campos a atualizar
        in: body
        name: body
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - ServiceToken: []
      summary: Atualiza AI Config
      tags:
      - ai-configs
  /ai-configs/{key}/versions:
    get:
      description: Retorna todas as versões anteriores da config — útil para auditoria
        e rollback
      parameters:
      - description: Chave da AI Config
        in: path
        name: key
        required: true
        type: string
      - description: UUID do projeto
        in: query
        name: project_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - ServiceToken: []
      summary: Histórico de versões da AI Config
      tags:
      - ai-configs
  /analytics/anomalies:
    get:
      description: Analisa uma métrica do projeto usando média móvel + desvio padrão
      parameters:
      - description: ID do projeto
        in: query
        name: project_id
        type: string
      - description: 'Nome da métrica (ex: page_view)'
        in: query
        name: metric
        required: true
        type: string
      - default: 7d
        description: 'Janela de análise (ex: 7d)'
        in: query
        name: window
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
      security:
      - ServiceToken: []
      summary: Detecta anomalias em métricas de eventos
      tags:
      - analytics
  /approvals/{id}/review:
