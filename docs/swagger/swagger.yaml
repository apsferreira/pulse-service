            $ref: '#/definitions/github_com_institutoitinerante_pulse-service_internal_domain.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_institutoitinerante_pulse-service_internal_domain.ErrorResponse'
      security:
      - ServiceToken: []
      summary: Lista aprovações pendentes
      tags:
      - approvals
