server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/x-javascript
        application/javascript
        application/json
        application/xml+rss;

    # Proxy /api/ + /health → backend pulse-service
    location /api/ {
        proxy_pass http://pulse-service:80/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check do backend — monitoramento externo via pulse.institutoitinerante.com.br/api/health
    location = /api/health {
        proxy_pass http://pulse-service:80/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # Widget CSAT e SDK — servir apenas os arquivos js, bloquear directory listing
    location ^~ /csat/ {
        try_files $uri =404;
    }
    location ^~ /sdk/ {
        try_files $uri =404;
    }

    # Runtime env config (injetado via entrypoint.sh para evitar secrets no docker history)
    # BKL-1063 / #60 — VITE_SERVICE_TOKEN não exposto em docker history
    location = /env-config.js {
        alias /tmp/env-config.js;
        add_header Cache-Control "no-cache, must-revalidate";
        access_log off;
    }

    # SPA routing — redireciona tudo para index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Health check
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
